$kind: http-request
url: "{{account_service_url}}/api/auth/register/driver"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Demo Driver",
      "email": "driver@example.com",
      "password": "Password123!",
      "phone": "+94777654321"
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) pm.environment.set('driver_id', pm.response.json().id);
order: 2000
