$kind: http-request
url: "{{account_service_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "passenger@example.com",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 200) pm.environment.set('token', pm.response.json().token);
order: 3000
