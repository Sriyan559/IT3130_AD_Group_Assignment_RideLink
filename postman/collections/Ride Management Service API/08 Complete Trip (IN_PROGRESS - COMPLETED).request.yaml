$kind: http-request
name: 08 Complete Trip (IN_PROGRESS -> COMPLETED)
description: Trip completes at destination with recorded distance and duration.
url: "{{ride_url}}/api/v1/rides/{{ride_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "COMPLETED",
      "distanceKm": 8.5,
      "durationMinutes": 22
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Status is COMPLETED with trip metrics", function () {
          pm.expect(jsonData.status).to.eql("COMPLETED");
          pm.expect(jsonData.distanceKm).to.eql(8.5);
          pm.expect(jsonData.durationMinutes).to.eql(22);
      });
    language: text/javascript
order: 8000
