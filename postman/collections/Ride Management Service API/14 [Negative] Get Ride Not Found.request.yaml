$kind: http-request
description: Tests 404 response when querying a non-existent UUID.
url: "{{ride_url}}/api/v1/rides/00000000-0000-0000-0000-000000000000"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
      var jsonData = pm.response.json();
      pm.test("Error indicates ride not found", function () {
          pm.expect(jsonData.error).to.include("Ride not found");
      });
    language: text/javascript
order: 14000
