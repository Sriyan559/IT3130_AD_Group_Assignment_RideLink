$kind: http-request
name: 07 Update Status to IN_PROGRESS (ACCEPTED -> IN_PROGRESS)
description: Passenger has boarded and trip has started.
url: "{{ride_url}}/api/v1/rides/{{ride_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "IN_PROGRESS"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Status is IN_PROGRESS", function () {
          pm.expect(jsonData.status).to.eql("IN_PROGRESS");
      });
    language: text/javascript
order: 7000
