$kind: http-request
description: Retrieves details of the ride created in step 02.
url: "{{ride_url}}/api/v1/rides/{{ride_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("ID matches environment ride_id", function () {
          pm.expect(jsonData.id).to.eql(pm.environment.get("ride_id"));
      });
    language: text/javascript
order: 4000
