$kind: http-request
name: 06 Update Status to ACCEPTED (ASSIGNED -> ACCEPTED)
description: Driver accepts the assigned ride.
url: "{{ride_url}}/api/v1/rides/{{ride_id}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "ACCEPTED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Status is ACCEPTED", function () {
          pm.expect(jsonData.status).to.eql("ACCEPTED");
      });
    language: text/javascript
order: 6000
