$kind: http-request
description: Tests bean validation failure when required fields are missing. Expects 400 Bad Request.
url: "{{ride_url}}/api/v1/rides"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "passengerId": null,
      "pickupAddress": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      var jsonData = pm.response.json();
      pm.test("Error indicates validation error", function () {
          pm.expect(jsonData.error).to.not.be.empty;
      });
    language: text/javascript
order: 15000
