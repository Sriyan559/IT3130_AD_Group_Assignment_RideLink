$kind: http-request
description: Fetches all rides assigned to driver 201.
url: "{{ride_url}}/api/v1/rides/driver/201"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Returns rides assigned to driver 201", function () {
          pm.expect(jsonData).to.be.an("array");
          pm.expect(jsonData.length).to.be.at.least(1);
          pm.expect(jsonData[0].driverId).to.eql(201);
      });
    language: text/javascript
order: 10000
