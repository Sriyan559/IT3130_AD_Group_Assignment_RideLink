$kind: http-request
name: "02 Create Ride Request (Initial: REQUESTED)"
description: Creates a new ride request for passenger 101. Initial status is REQUESTED.
url: "{{ride_url}}/api/v1/rides"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "passengerId": 101,
      "pickupLatitude": 6.9271,
      "pickupLongitude": 79.8612,
      "pickupAddress": "Colombo Fort Railway Station, Colombo",
      "destinationLatitude": 6.9147,
      "destinationLongitude": 79.8732,
      "destinationAddress": "SLIIT Metropolitan Campus, Colombo 03",
      "driverId": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      pm.test("Ride status is REQUESTED", function () {
          pm.expect(jsonData.status).to.eql("REQUESTED");
          pm.expect(jsonData.id).to.not.be.empty;
      });
      // Save ride_id for subsequent test steps
      pm.environment.set("ride_id", jsonData.id);
    language: text/javascript
order: 2000
