$kind: http-request
description: Cancels a ride while still in REQUESTED state.
url: "{{ride_url}}/api/v1/rides/{{cancel_ride_id}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Confirmation message received", function () {
          pm.expect(jsonData.message).to.include("cancelled");
      });
    language: text/javascript
order: 12000
