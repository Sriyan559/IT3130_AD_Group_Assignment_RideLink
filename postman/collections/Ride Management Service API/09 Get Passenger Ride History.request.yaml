$kind: http-request
description: Fetches all rides for passenger 101, ordered newest first.
url: "{{ride_url}}/api/v1/rides/passenger/101"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("History contains rides for passenger 101", function () {
          pm.expect(jsonData).to.be.an("array");
          pm.expect(jsonData.length).to.be.at.least(1);
          pm.expect(jsonData[0].passengerId).to.eql(101);
      });
    language: text/javascript
order: 9000
