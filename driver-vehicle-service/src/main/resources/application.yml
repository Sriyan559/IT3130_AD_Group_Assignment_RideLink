driver:
  search:
    # Set to 0 only for demos that deliberately allow old locations.
    max-location-age-seconds: ${DRIVER_LOCATION_MAX_AGE_SECONDS:300}

server:
  port: ${DRIVER_SERVICE_PORT:8082}

spring:
  application:
    name: driver-vehicle-service
  data:
    mongodb:
      host: ${DRIVER_DB_HOST:localhost}
      port: ${DRIVER_DB_PORT:27017}
      database: ${DRIVER_DB_NAME:driver_db}
      # username: ${DRIVER_DB_USERNAME:driver_user}
      # password: ${DRIVER_DB_PASSWORD:driver_password}
      # authentication-database: ${DRIVER_DB_AUTH_DB:admin}

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Account JWT verification and authenticated internal Driver calls.
ridelink:
  security:
    enabled: ${RIDELINK_SECURITY_ENABLED:true}
  account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  driver-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
  service-token: ${RIDELINK_SERVICE_TOKEN:}
