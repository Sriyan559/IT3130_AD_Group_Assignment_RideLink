server:
  port: ${ACCOUNT_SERVICE_PORT:8081}

spring:
  application:
    name: account-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/account_db}
      database: ${MONGODB_DATABASE:ridelink_account_db}
      auto-index-creation: true

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Security & JWT Configuration Placeholders
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Opt-in bootstrap for the first administrator. Keep disabled in normal operation.
account:
  admin:
    registration:
      enabled: ${ACCOUNT_ADMIN_REGISTRATION_ENABLED:false}
      key: ${ACCOUNT_ADMIN_REGISTRATION_KEY:}
    bootstrap:
      enabled: ${ACCOUNT_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${ACCOUNT_ADMIN_EMAIL:}
      password: ${ACCOUNT_ADMIN_PASSWORD:}
      full-name: ${ACCOUNT_ADMIN_FULL_NAME:RideLink Administrator}
      phone: ${ACCOUNT_ADMIN_PHONE:+94000000000}
