# Local-only persistent SQL demo. Default runtime remains PostgreSQL.
spring:
  datasource:
    url: ${PAYMENT_DEMO_URL:jdbc:h2:file:./tmp/payment-demo;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
